<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Graveyard | Where Code Rests in Peace</title>
    <meta name="description" content="Where abandoned side projects, forgotten repositories, and dead code rest in eternal peace. Pay your respects, share lessons learned, and honor developer burnout." />
    <meta name="theme-color" content="#050505" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dev-graveyard.vercel.app/" />
    <meta property="og:title" content="Dev Graveyard | Where Code Rests in Peace" />
    <meta property="og:description" content="Where abandoned side projects, forgotten repositories, and dead code rest in eternal peace. Pay your respects, share lessons learned, and honor developer burnout." />
    <meta property="og:image" content="https://dev-graveyard.vercel.app/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dev-graveyard.vercel.app/" />
    <meta name="twitter:title" content="Dev Graveyard | Where Code Rests in Peace" />
    <meta name="twitter:description" content="Where abandoned side projects, forgotten repositories, and dead code rest in eternal peace. Pay your respects, share lessons learned, and honor developer burnout." />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #050505;
        color: #e4e4e7;
        font-family: 'Inter', sans-serif;
      }
      
      /* Ultra-lightweight zero-cost CSS micro-grain texture for atmosphere */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
        opacity: 0.03;
        background-image: 
          radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.4) 1px, transparent 0),
          radial-gradient(circle at 3px 3px, rgba(255, 255, 255, 0.2) 1px, transparent 0);
        background-size: 4px 4px;
        contain: strict;
      }

      @media (max-width: 768px), (pointer: coarse) {
        .bg-noise {
          opacity: 0.02;
        }
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(223,54,54,0.3);
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(223,54,54,0.6);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
